<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IKRU x YUVI PROTECTION LIB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card fade-in">
      <h1>IKRU x YUVI PROTECTION LIB</h1>
      <p class="subtitle">Upload Android <code>lib.so</code> → analyze → protect → download</p>

      <div id="dropZone" class="drop-zone" tabindex="0" aria-label="Drop lib.so here">
        <input id="fileInput" type="file" accept=".so,application/octet-stream" hidden>
        <p><strong>Drag & Drop</strong> your <code>lib.so</code> file here</p>
        <p class="muted">or</p>
        <button id="browseBtn" class="btn">Browse File</button>
        <small>Max 10MB • Only .so files accepted</small>
      </div>

      <div class="workflow">
        <div class="step" id="step1">1. Upload</div>
        <div class="step" id="step2">2. Analyze</div>
        <div class="step" id="step3">3. Protect</div>
        <div class="step" id="step4">4. Download</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span id="statusText">Waiting for file...</span>
          <span id="progressText">0%</span>
        </div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>

      <div class="actions">
        <button id="protectBtn" class="btn btn-primary" disabled>Start Protection</button>
        <a id="downloadBtn" class="btn btn-success hidden" download>Download protected_lib.so</a>
      </div>

      <p id="resultBox" class="result muted">Ready.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
